<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="t d">
  <title id="t">CI already knew</title>
  <desc id="d">An ink drawing of a workflow as a river: two streams from the mountains, diff and tests, meet in the pool of review, pass the gate of verdict, and reach the sea, exit 0.</desc>
  <defs>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/>
    </filter>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14"/>
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <rect width="640" height="340" fill="#fafaf9"/>

  <!-- mountains, in wash -->
  <g filter="url(#wash)">
    <path d="M18 120 L92 34 L132 74 L170 40 L248 120 Z" fill="#292524" opacity="0.13"/>
    <path d="M60 120 L118 66 L168 120 Z" fill="#292524" opacity="0.10"/>
    <path d="M392 120 L470 30 L512 70 L560 44 L626 120 Z" fill="#292524" opacity="0.13"/>
    <path d="M440 120 L500 72 L560 120 Z" fill="#292524" opacity="0.10"/>
  </g>

  <!-- the sea: the exit code -->
  <g filter="url(#wash)">
    <path d="M0 290 C 120 282, 220 296, 320 288 C 430 280, 520 294, 640 286 L640 340 L0 340 Z" fill="#292524" opacity="0.10"/>
  </g>
  <g fill="none" stroke="#292524" stroke-linecap="round" filter="url(#ink)">
    <path d="M40 300 H118" stroke-width="1.4" opacity="0.5"/>
    <path d="M150 312 H260" stroke-width="1.4" opacity="0.4"/>
    <path d="M400 306 H520" stroke-width="1.4" opacity="0.45"/>
  </g>

  <!-- two streams: diff and tests, run side by side -->
  <g fill="none" stroke="#292524" stroke-linecap="round" filter="url(#ink)">
    <path d="M120 104 C 132 140, 196 150, 222 172 C 246 192, 280 196, 302 200" stroke-width="5"/>
    <path d="M506 104 C 494 140, 432 150, 408 172 C 384 192, 354 196, 338 200" stroke-width="5"/>
  </g>
  <!-- their pools: done, so they hold ink -->
  <g filter="url(#ink)">
    <ellipse cx="120" cy="104" rx="14" ry="7" fill="#292524" opacity="0.85"/>
    <ellipse cx="506" cy="104" rx="14" ry="7" fill="#292524" opacity="0.85"/>
  </g>

  <!-- where they meet: review, a pool that fills only when both have arrived -->
  <g filter="url(#ink)">
    <ellipse cx="320" cy="206" rx="34" ry="13" fill="#292524" opacity="0.82"/>
    <ellipse cx="320" cy="206" rx="44" ry="18" fill="none" stroke="#292524" stroke-width="1.6" opacity="0.5"/>
  </g>

  <!-- the river on, under the gate: verdict -->
  <g fill="none" stroke="#292524" stroke-linecap="round" filter="url(#ink)">
    <path d="M320 224 C 317 244, 323 262, 320 288" stroke-width="6"/>
  </g>
  <g fill="none" stroke="#292524" stroke-linecap="round" stroke-linejoin="round" filter="url(#ink)">
    <path d="M300 246 V 282" stroke-width="4"/>
    <path d="M340 246 V 282" stroke-width="4"/>
    <path d="M290 244 C 306 238, 334 238, 350 244" stroke-width="5"/>
    <path d="M296 253 H 344" stroke-width="2.6"/>
  </g>

  <!-- names, small, like a poet's notes -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#78716c" font-size="15">
    <text x="96" y="109" text-anchor="end">diff</text>
    <text x="530" y="109">tests</text>
    <text x="380" y="210">review</text>
    <text x="360" y="268">verdict</text>
    <text x="320" y="328" text-anchor="middle" fill="#292524">exit 0</text>
  </g>

  <!-- the seal: the painter's signature -->
  <g filter="url(#ink)">
    <rect x="574" y="250" width="34" height="34" rx="3" fill="#b4232a"/>
    <text x="591" y="273" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#fafaf9" letter-spacing="1">CI</text>
  </g>
</svg>
